- raw: 长兵，为长兵器，一种较长的手持格斗冷兵器，一般等于身长，或长于身长，以枪、棍为主。较之短兵器，其时效性更好，可以先发制人。\n若想成为执殳，需寻得执殳教导才行。执殳数量众多，江湖各处、枪棍学门派中不乏有他们行动的踪迹，甚大于有身份更高的煞钝、掌戈等，也可向他们求教。各大门派和江湖中也有执殳。(1515,636)处便有此身份之人。
